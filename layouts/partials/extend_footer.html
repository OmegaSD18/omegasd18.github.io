{{ $navMenu := resources.Get "js/extended/menu-trigger.js" | js.Build "menu-trigger.js" | minify | fingerprint }}
<script language="javascript" type="text/javascript" src="{{ $navMenu.Permalink }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const headers = Array.from(document.querySelectorAll('.post-content h1[id], .post-content h2[id], .post-content h3[id], .post-content h4[id]'));
    const tocLinks = document.querySelectorAll('.toc a');

    if (headers.length === 0 || tocLinks.length === 0) return;

    function updateActiveToc() {
      let activeHeader = headers[0];

      // Track the header closest to the top of the viewport
      for (let i = 0; i < headers.length; i++) {
        const rect = headers[i].getBoundingClientRect();
        // The 120px threshold ensures it highlights exactly when the text clears the top edge
        if (rect.top > 0 && rect.top < 120) {
          activeHeader = headers[i];
          break;
        } else if (rect.top <= 0) {
          activeHeader = headers[i];
        }
      }

      // Clear all active classes
      tocLinks.forEach(link => link.classList.remove('active'));

      // Apply the active class to the current section
      if (activeHeader) {
        const id = activeHeader.getAttribute('id');
        const activeLink = document.querySelector(`.toc a[href="#${id}"]`);
        if (activeLink) {
          activeLink.classList.add('active');
        }
      }
    }

    // Attach to scroll and run immediately on page load
    window.addEventListener('scroll', updateActiveToc, { passive: true });
    updateActiveToc();
  });
</script>
