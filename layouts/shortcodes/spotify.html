<div class="spotify-widget-wrapper">
    <!-- Updated title to requested phrase -->
    <h5 class="now-playing-title">Listen along with me</h5>
    
    <a id="spotify-link" href="#" target="_blank" rel="noopener noreferrer" class="spotify-player hidden">
        <img id="player-cover" class="player-cover" src="" alt="Album Art">
        
        <div class="player-center">
            <div class="player-info">
                <div class="player-title" id="player-title">Loading...</div>
                <div class="player-artist" id="player-artist"></div>
            </div>
            
            <div class="player-controls">
                <!-- Skip Back Icon -->
                <svg class="ctrl-icon" viewBox="0 0 16 16"><path d="M13 2.5L5 7.119V3H3v10h2V8.881l8 4.619z"/></svg>
                <!-- Play/Pause Button -->
                <div class="play-pause-btn">
                    <svg viewBox="0 0 16 16"><path d="M2.7 1a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h2.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7H2.7zm8 0a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h2.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7h-2.6z"/></svg>
                </div>
                <!-- Skip Forward Icon -->
                <svg class="ctrl-icon" viewBox="0 0 16 16"><path d="M11 3v4.119L3 2.5v11l8-4.619V13h2V3z"/></svg>
            </div>
            
            <div class="player-progress">
                <div class="progress-fill"></div>
            </div>
        </div>
        
        <div class="player-right">
            <!-- Spotify Logo -->
            <svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.56.3z"/></svg>
            <!-- Animated Equalizer -->
            <div class="now-playing-eq">
                <span></span><span></span><span></span>
            </div>
        </div>
    </a>
    <div id="spotify-offline" class="spotify-offline">Not playing anything right now.</div>
</div>

<script>
    async function fetchNowPlaying() {
        // REPLACE WITH YOUR VERCEL DOMAIN URL:
        const endpoint = 'https://spotify-widget-backend.vercel.app/api/now-playing'; 
        
        try {
            const response = await fetch(endpoint);
            const data = await response.json();
            
            const card = document.getElementById('spotify-link');
            const offline = document.getElementById('spotify-offline');
            
            if (data.isPlaying) {
                document.getElementById('player-title').innerText = data.title;
                document.getElementById('player-artist').innerText = data.artist;
                document.getElementById('player-cover').src = data.albumImageUrl;
                document.getElementById('spotify-link').href = data.songUrl;
                
                card.classList.remove('hidden');
                offline.style.display = 'none';
            } else {
                card.classList.add('hidden');
                offline.style.display = 'block';
            }
        } catch (error) {
            console.error('Error fetching Spotify data:', error);
        }
    }
    
    fetchNowPlaying();
    setInterval(fetchNowPlaying, 15000);
</script>
